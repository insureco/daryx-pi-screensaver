<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #000;
            color: #fff;
            font-family: 'Exo 2', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 2vh 3vw;
        }

        /* Top section - two columns */
        .top-section {
            display: flex;
            align-items: center;
            gap: 3vw;
            padding-top: 2vh;
        }
        .time {
            font-size: 9vw;
            font-weight: 300;
            letter-spacing: -0.02em;
            line-height: 1;
            min-width: 30vw;
        }
        .time .seconds {
            font-size: 3vw;
            opacity: 0.5;
            vertical-align: super;
            margin-left: 0.1em;
            display: inline-block;
            min-width: 4vw;
        }
        .top-info {
            display: flex;
            flex-direction: column;
            gap: 0.5vh;
        }
        .date {
            font-size: 3vw;
            font-weight: 400;
            opacity: 0.7;
        }
        .weather-sun {
            display: flex;
            gap: 2vw;
            align-items: baseline;
            font-size: 2.2vw;
            opacity: 0.6;
        }
        .weather-sun .sun {
            font-size: 1.8vw;
        }

        /* Middle section - meetings (hero area) */
        .middle-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .event-row {
            text-align: center;
            width: 100%;
        }
        .event-title {
            font-size: 8vw;
            font-weight: 400;
            margin-bottom: 1vh;
        }
        .event-countdown {
            font-size: 9vw;
            font-weight: 700;
            opacity: 1;
        }
        .in-meeting {
            color: #4CAF50;
        }
        .event-soon {
            color: #FFC107;
        }
        .event-urgent {
            color: #ff4444;
        }
        .no-events {
            font-size: 4vw;
            opacity: 0.3;
        }

        /* Alert buttons */
        .alert-buttons {
            display: flex;
            gap: 4vw;
            margin-top: 4vh;
            justify-content: center;
        }
        .alert-btn {
            padding: 2vh 4vw;
            font-size: 3.5vw;
            font-family: 'Exo 2', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: 1vw;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-confirm {
            background: #4CAF50;
            color: #fff;
        }
        .btn-snooze {
            background: #666;
            color: #fff;
        }
        .alert-btn:active {
            transform: scale(0.95);
        }

        /* Flashing animation */
        @keyframes flash-urgent {
            0%, 50% { background: #000; }
            25%, 75% { background: #330000; }
        }
        @keyframes pulse-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .flashing {
            animation: flash-urgent 1s infinite;
        }
        .pulse {
            animation: pulse-text 0.5s infinite;
        }

        /* Bottom section */
        .bottom-section {
            display: flex;
            flex-direction: column;
            gap: 1vh;
        }
        .close-btn {
            position: fixed;
            top: 2vh;
            right: 3vw;
            font-size: 4vw;
            opacity: 0.3;
            text-decoration: none;
            color: #fff;
            padding: 1vw 2vw;
            z-index: 100;
        }
        .close-btn:hover, .close-btn:active {
            opacity: 0.8;
        }

        .sunset-countdown {
            font-size: 2vw;
            opacity: 0.5;
            text-align: center;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 3vw;
            font-size: 2vw;
            opacity: 0.5;
        }
        .stat {
            display: flex;
            align-items: center;
            gap: 0.3em;
        }

        /* Wellness strip (daryx-wellness vitals) */
        .wellness-strip {
            display: flex;
            justify-content: center;
            gap: 2.5vw;
            font-size: 2vw;
            opacity: 0.5;
        }
        .wellness-strip .wstat {
            display: flex;
            align-items: center;
            gap: 0.3em;
        }

        /* Tomorrow button */
        .tomorrow-btn {
            padding: 1.5vh 3vw;
            font-size: 2.5vw;
            font-family: 'Exo 2', sans-serif;
            font-weight: 600;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 1vw;
            background: transparent;
            color: #fff;
            cursor: pointer;
            margin-top: 2vh;
        }
        .tomorrow-btn:active {
            background: rgba(255,255,255,0.1);
        }

        /* Agenda overlay */
        .agenda-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 200;
            display: none;
            flex-direction: column;
            padding: 3vh 4vw;
            user-select: none;
            -webkit-user-select: none;
        }
        .agenda-overlay.visible {
            display: flex;
        }
        .agenda-header {
            display: flex;
            align-items: center;
            gap: 3vw;
            margin-bottom: 4vh;
        }
        .back-btn {
            font-size: 5vw;
            color: #fff;
            text-decoration: none;
            opacity: 0.7;
            cursor: pointer;
            padding: 1vw;
        }
        .back-btn:active {
            opacity: 1;
        }
        .agenda-title {
            font-size: 4vw;
            font-weight: 400;
        }
        .agenda-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
        }
        .agenda-list::-webkit-scrollbar {
            width: 8px;
        }
        .agenda-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
        }
        .scroll-btns {
            display: flex;
            gap: 2vw;
            margin-left: auto;
        }
        .scroll-btn {
            padding: 1vh 3vw;
            font-size: 4vw;
            background: rgba(255,255,255,0.15);
            border: none;
            border-radius: 1vw;
            color: #fff;
            cursor: pointer;
        }
        .scroll-btn:active {
            background: rgba(255,255,255,0.3);
        }
        .scroll-btn:disabled {
            opacity: 0.2;
        }
        .agenda-item {
            display: flex;
            align-items: baseline;
            padding: 2vh 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .agenda-time {
            font-size: 3vw;
            opacity: 0.6;
            min-width: 18vw;
            text-align: right;
            padding-right: 3vw;
        }
        .agenda-event-title {
            font-size: 3.5vw;
            flex: 1;
        }
    </style>
</head>
<body>
    <a href="/to-desktop" class="close-btn">✕</a>

    <!-- Tomorrow's Agenda Overlay -->
    <div class="agenda-overlay" id="agenda-overlay">
        <div class="agenda-header">
            <span class="back-btn" onclick="hideAgenda()">←</span>
            <span class="agenda-title" id="agenda-title">Tomorrow</span>
            <div class="scroll-btns">
                <button type="button" class="scroll-btn" id="scroll-up-btn">▲</button>
                <button type="button" class="scroll-btn" id="scroll-down-btn">▼</button>
            </div>
        </div>
        <div class="agenda-list" id="agenda-list"></div>
    </div>

    <div class="container">
        <!-- Top: Clock | Date + Weather/Sun -->
        <div class="top-section">
            <div class="time">
                <span id="hours">--</span>:<span id="minutes">--</span><span class="seconds" id="seconds">--</span>
            </div>
            <div class="top-info">
                <div class="date" id="date">Loading...</div>
                <div class="weather-sun">
                    <span id="weather">--</span>
                    <span class="sun">🌅 <span id="sunrise">--</span></span>
                    <span class="sun">🌇 <span id="sunset">--</span></span>
                </div>
            </div>
        </div>

        <!-- Middle: Next Meeting (hero) -->
        <div class="middle-section">
            <div class="event-row" id="event-row">
                <div class="no-events">No upcoming meetings</div>
            </div>
        </div>

        <!-- Bottom: Sunset countdown and Stats -->
        <div class="bottom-section">
            <div class="wellness-strip" id="wellness-strip" style="display:none">
                <span class="wstat" id="wstat-sleep">😴 <span id="wl-sleep">--</span></span>
                <span class="wstat" id="wstat-readiness">⚡ <span id="wl-readiness">--</span></span>
                <span class="wstat" id="wstat-hrv">🫀 <span id="wl-hrv">--</span>ms</span>
                <span class="wstat" id="wstat-fast">⏳ <span id="wl-fast">--</span></span>
            </div>
            <div class="sunset-countdown" id="sunset-countdown"></div>
            <div class="stats">
                <span class="stat">🌡️ <span id="cpu-temp">--</span>°</span>
                <span class="stat">🛡️ <span id="blocked">--</span></span>
                <span class="stat">💾 <span id="mem">--</span>%</span>
                <span class="stat">⏱️ <span id="uptime">--</span></span>
            </div>
        </div>
    </div>
    <script>
        let sunsetTime = null;
        let sunriseTime = null;
        let snoozedUntil = null;
        let lastEventId = null;
        let tomorrowSummary = null;
        let tomorrowEvents = [];
        let lastEventData = null;
        let snoozeTickInterval = null;

        let agendaScrollIndex = 0;
        const ITEMS_PER_PAGE = 5;

        let touchStartY = 0;

        function setupTouchScrolling() {
            const overlay = document.getElementById('agenda-overlay');

            overlay.ontouchstart = function(e) {
                touchStartY = e.touches[0].clientY;
            };

            overlay.ontouchend = function(e) {
                const touchEndY = e.changedTouches[0].clientY;
                const diff = touchStartY - touchEndY;

                // Swipe threshold of 50px
                if (diff > 50) {
                    // Swiped up - scroll down
                    scrollAgenda(1);
                } else if (diff < -50) {
                    // Swiped down - scroll up
                    scrollAgenda(-1);
                }
            };
        }

        function showAgenda() {
            const overlay = document.getElementById('agenda-overlay');
            const title = document.getElementById('agenda-title');
            const list = document.getElementById('agenda-list');

            // Set title to tomorrow's date
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            title.textContent = tomorrow.toLocaleDateString('en-US', options);

            // Attach click handlers to scroll buttons
            document.getElementById('scroll-up-btn').onclick = function() { scrollAgenda(-1); };
            document.getElementById('scroll-down-btn').onclick = function() { scrollAgenda(1); };

            // Listen for native scroll to update buttons
            list.onscroll = updateScrollButtons;

            // Reset scroll position
            list.scrollTop = 0;

            renderAgendaItems();
            overlay.classList.add('visible');
        }

        function renderAgendaItems() {
            const list = document.getElementById('agenda-list');

            if (tomorrowEvents.length === 0) {
                list.innerHTML = '<div style="font-size: 3vw; opacity: 0.5; text-align: center; margin-top: 10vh;">No meetings scheduled</div>';
                return;
            }

            let html = '';
            // Render ALL items - let native touch scrolling handle it
            for (const event of tomorrowEvents) {
                html += '<div class="agenda-item">';
                html += '<span class="agenda-time">' + event.start_time + '</span>';
                html += '<span class="agenda-event-title">' + event.title + '</span>';
                html += '</div>';
            }

            list.innerHTML = html;

            // Update button states based on scroll position
            updateScrollButtons();
        }

        function updateScrollButtons() {
            const list = document.getElementById('agenda-list');
            const canScrollUp = list.scrollTop > 0;
            const canScrollDown = list.scrollTop < list.scrollHeight - list.clientHeight - 5;
            document.getElementById('scroll-up-btn').disabled = !canScrollUp;
            document.getElementById('scroll-down-btn').disabled = !canScrollDown;
        }

        function scrollAgenda(direction) {
            const list = document.getElementById('agenda-list');
            const scrollAmount = 80; // pixels per button press
            list.scrollBy({ top: direction * scrollAmount, behavior: 'smooth' });
            setTimeout(updateScrollButtons, 100);
        }

        function hideAgenda() {
            document.getElementById('agenda-overlay').classList.remove('visible');
        }

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            hours = hours % 12 || 12;
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;

            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);

            updateSunsetCountdown();
        }

        function updateSunsetCountdown() {
            const el = document.getElementById('sunset-countdown');
            const now = new Date();

            if (sunsetTime) {
                const diff = sunsetTime - now;

                if (diff > 0) {
                    // Before sunset - show time until sunset
                    const hours = Math.floor(diff / 3600000);
                    const mins = Math.floor((diff % 3600000) / 60000);
                    if (hours > 0) {
                        el.textContent = `☀️ ${hours}h ${mins}m until sunset`;
                    } else {
                        el.textContent = `☀️ ${mins}m until sunset`;
                    }
                    return;
                }
            }

            // After sunset - show time until sunrise
            if (sunriseTime) {
                // Sunrise is tomorrow
                let nextSunrise = new Date(sunriseTime);
                if (nextSunrise <= now) {
                    nextSunrise.setDate(nextSunrise.getDate() + 1);
                }
                const diff = nextSunrise - now;
                const hours = Math.floor(diff / 3600000);
                const mins = Math.floor((diff % 3600000) / 60000);

                if (hours > 0) {
                    el.textContent = `🌙 sun has set, returns in ${hours}h ${mins}m`;
                } else {
                    el.textContent = `🌙 sun has set, returns in ${mins}m`;
                }
            } else {
                el.textContent = '🌙 sun has set';
            }
        }

        function parseSunTime(timeStr) {
            const match = timeStr.match(/(\d+):(\d+)(AM|PM)/i);
            if (!match) return null;

            let hours = parseInt(match[1]);
            const mins = parseInt(match[2]);
            const ampm = match[3].toUpperCase();

            if (ampm === 'PM' && hours !== 12) hours += 12;
            if (ampm === 'AM' && hours === 12) hours = 0;

            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, mins, 0);
        }

        function formatNum(n) {
            if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n/1000).toFixed(1) + 'k';
            return n;
        }

        function dismissMeeting(meetingId) {
            fetch('/dismiss', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ meeting_id: meetingId })
            })
                .then(() => fetch('/stats'))
                .then(r => r.json())
                .then(data => handleStatsData(data))
                .catch(e => console.log('Dismiss error:', e));
            document.body.classList.remove('flashing');
        }

        function snoozeMeeting() {
            snoozedUntil = Date.now() + 60000; // 1 minute
            document.body.classList.remove('flashing');
            fetch('/snooze', { method: 'POST' })
                .catch(function() {});
            startSnoozeTick();
        }

        function startSnoozeTick() {
            if (snoozeTickInterval) clearInterval(snoozeTickInterval);
            snoozeTickInterval = setInterval(function() {
                if (!snoozedUntil || Date.now() >= snoozedUntil) {
                    clearInterval(snoozeTickInterval);
                    snoozeTickInterval = null;
                    snoozedUntil = null;
                }
                if (lastEventData) updateEventDisplay(lastEventData);
            }, 1000);
        }

        function updateEventDisplay(event) {
            lastEventData = event;
            const row = document.getElementById('event-row');
            const now = Date.now();

            // Check if snoozed
            const isSnoozed = snoozedUntil && now < snoozedUntil;

            // Check per-meeting acknowledgment
            const acked = (event && event.acknowledged_meetings) || [];
            const currentAcked = event && event.current_start_iso && acked.includes(event.current_start_iso);
            const nextAcked = event && event.next_start_iso && acked.includes(event.next_start_iso);

            if (!event || (!event.next_title && !event.in_meeting)) {
                row.innerHTML = '<div class="no-events">No upcoming meetings</div>';
                document.body.classList.remove('flashing');
                return;
            }

            // Parse minutes from countdown
            let mins = 999;
            const countdown = event.next_countdown || '';

            if (countdown === 'now' || countdown.includes('now')) {
                mins = 0;
            } else if (countdown.includes('m') && !countdown.includes('h') && !countdown.includes('d')) {
                mins = parseInt(countdown.match(/\d+/)?.[0] || '999');
            } else if (countdown.includes('h')) {
                const hourMatch = countdown.match(/(\d+)h/);
                const minMatch = countdown.match(/(\d+)m/);
                mins = (parseInt(hourMatch?.[1] || '0') * 60) + parseInt(minMatch?.[1] || '0');
            }

            // Determine alert level for NEXT meeting
            const isUrgent = mins <= 3;
            const isSoon = mins <= 15 && mins > 3;
            const isStarting = mins === 0;

            // Check if current meeting needs alert (started < 15 mins ago, not acknowledged)
            const currentMeetingNeedsAlert = event.in_meeting &&
                !currentAcked &&
                event.current_started_mins_ago !== null &&
                event.current_started_mins_ago < 15;

            // Check if next meeting needs urgent alert (< 3 min, not acknowledged)
            const nextMeetingNeedsAlert = (isUrgent || isStarting) && !nextAcked;

            let html = '';

            // Helper to render alert buttons (used in flashing states)
            function renderAlertButtons(meetingId) {
                if (!isSnoozed) {
                    return '<div class="alert-buttons">'
                        + '<button class="alert-btn btn-confirm" onclick="dismissMeeting(\'' + meetingId + '\')">I\'m In</button>'
                        + '<button class="alert-btn btn-snooze" onclick="snoozeMeeting()">Snooze 1m</button>'
                        + '</div>';
                }
                const secsLeft = Math.ceil((snoozedUntil - now) / 1000);
                return '<div class="alert-buttons">'
                    + '<button class="alert-btn btn-confirm" onclick="dismissMeeting(\'' + meetingId + '\')">I\'m In</button>'
                    + '<button class="alert-btn btn-snooze" disabled style="opacity:0.4">Snoozed ' + secsLeft + 's</button>'
                    + '</div>';
            }

            // Helper to render calm "In: meeting" state with next meeting info
            function renderCalmState() {
                let h = '';
                const currentName = event.current_title || 'meeting';
                h += '<div class="in-meeting" style="font-size: 4vw; margin-bottom: 1vh;">🟢 In: ' + currentName + '</div>';
                if (event.next_is_tomorrow && event.tomorrow_summary) {
                    h += '<div style="font-size: 3vw; opacity: 0.5; margin-top: 3vh;">✓ Nothing left today</div>';
                    const ts = event.tomorrow_summary;
                    h += '<div style="font-size: 3vw; opacity: 0.7; margin-top: 2vh;">Tomorrow: ' + ts.count + ' meeting' + (ts.count > 1 ? 's' : '') + '</div>';
                    h += '<div style="font-size: 2.5vw; opacity: 0.5;">First: ' + ts.first_time + '  •  Last: ' + ts.last_time + '</div>';
                    h += '<button class="tomorrow-btn" onclick="showAgenda()">View Tomorrow →</button>';
                } else if (event.next_title) {
                    h += '<div style="font-size: 3.5vw; opacity: 0.5; margin-top: 3vh;">Next: ' + event.next_title + '</div>';
                    h += '<div style="font-size: 3vw; opacity: 0.4;">' + event.next_countdown + '</div>';
                } else {
                    h += '<div style="font-size: 3vw; opacity: 0.4; margin-top: 3vh;">✓ Nothing left today</div>';
                }
                return h;
            }

            // PRIORITY 1: Current meeting started, not yet acknowledged (< 15 min)
            if (currentMeetingNeedsAlert) {
                if (!isSnoozed) {
                    document.body.classList.add('flashing');
                } else {
                    document.body.classList.remove('flashing');
                }

                const minsLate = event.current_started_mins_ago || 0;
                if (minsLate === 0) {
                    html += '<div class="event-urgent pulse" style="font-size: 5vw; margin-bottom: 2vh;">🔴 STARTING NOW 🔴</div>';
                } else {
                    html += '<div class="event-urgent pulse" style="font-size: 5vw; margin-bottom: 2vh;">🔴 STARTED ' + minsLate + ' MIN AGO 🔴</div>';
                }
                html += '<div class="event-title event-urgent">' + event.current_title + '</div>';
                html += renderAlertButtons(event.current_start_iso);

            // PRIORITY 2: Next meeting is urgent AND not acknowledged (even if in another meeting)
            } else if (nextMeetingNeedsAlert) {
                if (!isSnoozed) {
                    document.body.classList.add('flashing');
                } else {
                    document.body.classList.remove('flashing');
                }

                if (isStarting) {
                    html += '<div class="event-urgent pulse" style="font-size: 5vw; margin-bottom: 2vh;">🔴 STARTING NOW 🔴</div>';
                } else {
                    html += '<div class="event-urgent pulse" style="font-size: 5vw; margin-bottom: 2vh;">⚠️ ' + mins + ' MIN ⚠️</div>';
                }
                html += '<div class="event-title event-urgent">' + event.next_title + '</div>';
                html += renderAlertButtons(event.next_start_iso);

            // PRIORITY 3: In meeting (acknowledged or > 15 min) - calm state
            } else if (event.in_meeting) {
                document.body.classList.remove('flashing');
                html += renderCalmState();

            // PRIORITY 4: Upcoming meeting is soon (3-15 mins)
            } else if (isSoon) {
                document.body.classList.remove('flashing');
                html += '<div class="event-soon">';
                html += '<div class="event-title">🟡 ' + event.next_title + '</div>';
                html += '<div class="event-countdown">' + event.next_countdown + '</div>';
                html += '</div>';

            } else if (event.next_is_tomorrow) {
                document.body.classList.remove('flashing');
                html += '<div style="font-size: 5vw; opacity: 0.6; margin-bottom: 3vh;">✓ Nothing left today</div>';
                if (event.tomorrow_summary) {
                    const ts = event.tomorrow_summary;
                    html += '<div style="font-size: 4vw; opacity: 0.8;">Tomorrow: ' + ts.count + ' meeting' + (ts.count > 1 ? 's' : '') + '</div>';
                    html += '<div style="font-size: 3vw; opacity: 0.5; margin-top: 1vh;">First: ' + ts.first_time + '  •  Last: ' + ts.last_time + '</div>';
                    html += '<button class="tomorrow-btn" onclick="showAgenda()">View Tomorrow →</button>';
                } else {
                    html += '<div class="event-title" style="opacity: 0.7;">Tomorrow: ' + event.next_title + '</div>';
                }

            } else {
                document.body.classList.remove('flashing');
                html += '<div class="event-title">' + event.next_title + '</div>';
                html += '<div class="event-countdown">' + event.next_countdown + '</div>';
            }

            row.innerHTML = html;
        }

        function updateWellness(w) {
            const strip = document.getElementById('wellness-strip');
            if (!w) {
                strip.style.display = 'none';
                return;
            }
            let any = false;
            function setStat(id, valueId, value) {
                const el = document.getElementById(id);
                if (value === null || value === undefined) {
                    el.style.display = 'none';
                    return;
                }
                document.getElementById(valueId).textContent = value;
                el.style.display = '';
                any = true;
            }
            setStat('wstat-sleep', 'wl-sleep', w.sleep);
            setStat('wstat-readiness', 'wl-readiness', w.readiness);
            setStat('wstat-hrv', 'wl-hrv', w.hrv);
            if (w.fast) {
                const h = Math.floor(w.fast.elapsedHrs);
                const m = Math.round((w.fast.elapsedHrs - h) * 60);
                setStat('wstat-fast', 'wl-fast', h + ':' + String(m).padStart(2, '0') + ' / ' + w.fast.targetHrs + 'h');
            } else {
                document.getElementById('wstat-fast').style.display = 'none';
            }
            strip.style.display = any ? 'flex' : 'none';
        }

        function handleStatsData(data) {
            if (data.cpu_temp_f) document.getElementById('cpu-temp').textContent = data.cpu_temp_f;
            if (data.mem_percent) document.getElementById('mem').textContent = data.mem_percent;
            if (data.uptime) document.getElementById('uptime').textContent = data.uptime;
            if (data.blocked_total !== null) {
                document.getElementById('blocked').textContent = formatNum(data.blocked_total);
            }
            if (data.weather_f && data.weather_desc) {
                document.getElementById('weather').textContent = data.weather_f + '° ' + data.weather_desc;
            }
            if (data.sunrise) {
                document.getElementById('sunrise').textContent = data.sunrise;
                sunriseTime = parseSunTime(data.sunrise);
            }
            if (data.sunset) {
                document.getElementById('sunset').textContent = data.sunset;
                sunsetTime = parseSunTime(data.sunset);
            }
            updateSunsetCountdown();
            updateWellness(data.wellness);

            // Store tomorrow's data for agenda view
            if (data.next_event) {
                tomorrowSummary = data.next_event.tomorrow_summary || null;
                tomorrowEvents = data.next_event.tomorrow_events || [];
            }

            updateEventDisplay(data.next_event);
        }

        // SSE with reconnection and polling fallback
        let eventSource = null;
        let reconnectAttempts = 0;
        let lastDataTime = Date.now();

        function connectSSE() {
            if (eventSource) {
                eventSource.close();
            }
            eventSource = new EventSource('/stream');

            eventSource.onmessage = function(event) {
                try {
                    handleStatsData(JSON.parse(event.data));
                    lastDataTime = Date.now();
                    reconnectAttempts = 0;
                } catch (e) {}
            };

            eventSource.onerror = function() {
                eventSource.close();
                reconnectAttempts++;
                if (reconnectAttempts < 10) {
                    setTimeout(connectSSE, Math.min(1000 * Math.pow(2, reconnectAttempts - 1), 30000));
                } else {
                    startPollingFallback();
                }
            };

            eventSource.onopen = function() {
                reconnectAttempts = 0;
            };
        }

        let pollingInterval = null;
        function startPollingFallback() {
            if (pollingInterval) return;
            pollingInterval = setInterval(function() {
                fetch('/stats')
                    .then(r => r.json())
                    .then(handleStatsData)
                    .catch(function() {});
            }, 5000);
        }

        // Watchdog: reconnect if no data for 30s
        setInterval(function() {
            if (Date.now() - lastDataTime > 30000) {
                lastDataTime = Date.now();
                reconnectAttempts = 0;
                connectSSE();
            }
        }, 10000);

        updateTime();
        connectSSE();
        setupTouchScrolling();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
